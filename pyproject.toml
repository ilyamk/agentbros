[tool.uv.dependency-groups]
offset = { requires-python = ">=3.12,<3.13" }

[tool.uv]
package = false
required-version = ">=0.13.9"
torch-backend = "cpu"
constraint-dependencies = ["setuptools>=84.2.1"]
default-groups = ["dev"]
# Each worker selects one profile in its own environment.
conflicts = [[
    { group = "reference" },
    { group = "reference-audio" },
    { group = "transnet" },
    { group = "audio-map" },
    { group = "stems" },
    { group = "multicam" },
    { group = "offset" },
    { group = "asr" },
    { group = "portable-voice" },
    { group = "vad" },
    { group = "diarize" },
    { group = "sfx-index" },
    { group = "clap" },
    { group = "matte" },
    { group = "vork" },
    { group = "earshot" },
    { group = "cmake" },
    { group = "yt-dlp" },
]]

# torch-backend routes torch alone; torchaudio and torchcodec Linux x64 wheels on PyPI are CUDA builds that need
# libcudart or libnvrtc, so they come from the same CPU index as torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
python_files = ["test_*.py", "*.test.py"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
xfail_strict = true
markers = ["slow: optional native or model integration"]

[tool.ruff]
line-length = 200
target-version = "py313"
required-version = "==0.17.5"
force-exclude = true
include = ["*.py", "*.pyi"]
unsafe-fixes = false
extend-exclude = ["vendor", ".agents", "docs/verification", "tests/helpers/rhythm-*.py", "src/lib/audio/rhythm-artifact-metadata.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "CPY001", "INP001"]

[tool.ruff.per-file-target-version]
"workers/resolve_worker.py" = "py39"
"tests/fixtures/resolve-sdk/**/*.py" = "py39"
"tests/fixtures/*blender*.py" = "py311"
"examples/vork/blender-source.py" = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
# unittest assertions and descriptive test names are intentional.
"tests/**/*.py" = ["S101", "D102", "D103", "PT009", "PT027", "D101", "D107", "PLR2004", "SLF001"]
# These methods reproduce the external Resolve SDK interface.
"tests/fixtures/resolve-sdk/**/*.py" = ["N802", "N803", "FBT001", "FBT003"]
# Native SDK spellings and positional flags form the external interface.
"workers/resolve_worker.py" = ["N802", "FBT001", "FBT003"]
# Imports inside operations keep optional ML/native runtimes lazy.
"scripts/workers/*.py" = ["PLC0415"]
# Measured signal classifiers keep empirical thresholds beside their formulas.
"scripts/workers/reference-analysis.py" = ["PLC0415", "PLR2004"]
"scripts/workers/reference-moves.py" = ["PLC0415", "PLR2004"]
"scripts/workers/sfx-index.py" = ["PLC0415", "PLR2004"]
# CIEDE2000 and hue-wrap constants are part of the published formulas.
"scripts/workers/colour_maths.py" = ["PLR2004"]
# Seeded scene variation is not a cryptographic use of randomness.
"scripts/blender/**/*.py" = ["S311"]

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["scripts/blender", "scripts/workers", "scripts/workers/blender", "scripts/blender/recipes"]

[tool.ty.src]
include = ["**/*.py"]
exclude = ["vendor", ".agents", "docs/verification", "tests/helpers/rhythm-*.py", "src/lib/audio/rhythm-artifact-metadata.py"]

[tool.ty.terminal]
error-on-warning = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.analysis]
allowed-unresolved-imports = ["bpy", "bmesh", "mathutils", "mathutils.*", "addon_utils", "bpy_extras", "bpy_extras.*", "DaVinciResolveScript"]
