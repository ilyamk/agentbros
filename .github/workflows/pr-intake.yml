name: pr-intake

on:
  pull_request:
    # Label changes (for example design-approved) re-run intake so the required check reflects them.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

permissions: {}

jobs:
  pr-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      - name: Required dependency audit and licence gate
        env:
          DEPENDENCY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: pnpm deps:check --base "$DEPENDENCY_BASE"
      - name: Intake and bounded triage artefact
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm github:facts --check --out out/pr-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pr-report
          path: out/pr-report
          retention-days: 7
