name: pr-intake

on:
  pull_request:
    # Label changes (for example design-approved) re-run intake so the required check reflects them.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

permissions: {}

jobs:
  pr-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      - name: Required dependency audit and licence gate
        env:
          DEPENDENCY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: pnpm deps:check --base "$DEPENDENCY_BASE"
      - name: Intake and bounded triage artefact
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm github:facts --check --out out/pr-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pr-report
          path: out/pr-report
          retention-days: 7
