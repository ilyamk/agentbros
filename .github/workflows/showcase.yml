name: showcase

on:
  push:
    branches: [main]
    paths: ['showcases/*/showcase.json']

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      - name: Fetch and sanitise changed showcase media
        env:
          BASE_SHA: ${{ github.event.before }}
          MERGE_SHA: ${{ github.sha }}
        run: pnpm showcase:fetch-media --base "$BASE_SHA" --head "$MERGE_SHA" --out out/showcase-media
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-media
          path: out/showcase-media
          if-no-files-found: error
          retention-days: 7
  validate:
    # ffprobe parses the untrusted artefact here, in a job without secrets or write permissions.
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: showcase-media
          path: out/untrusted-showcase
      - name: Probe media (no credentials)
        run: pnpm --silent showcase:fetch-media --validate out/untrusted-showcase > /dev/null
  publish:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GITHUB_TOKEN only reads; uploads and the metadata push use the automation App token.
    permissions: { contents: read }
    environment: automation
    concurrency:
      group: base-regeneration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: showcase-media
          path: out/untrusted-showcase
      - name: Mint the automation App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID || vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY || secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Revalidate artefact and publish release assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Structural checks only (inventory, schema, sizes, hashes, magic bytes): no media parser runs beside the token.
          pnpm --silent showcase:fetch-media --validate out/untrusted-showcase --structural > /tmp/showcase-validation.json
          if [ "$(jq '.metadata.assets | length' /tmp/showcase-validation.json)" -eq 0 ]; then exit 0; fi
          if ! gh release view showcase-media > /dev/null 2>&1; then
            # Never the repository's "Latest" release: that stays the newest vX.Y.Z. Uploads do not change it.
            gh release create showcase-media --latest=false --title 'Showcase media' --notes 'Sanitised showcase thumbnails, contact sheets and previews.'
          fi
          mkdir -p out/showcase-upload
          jq -c '.metadata.assets[]' /tmp/showcase-validation.json | while IFS= read -r asset; do
            input=$(printf '%s' "$asset" | jq -er '.input')
            name=$(printf '%s' "$asset" | jq -er '.name')
            cp -- "$input" "out/showcase-upload/$name"
            gh release upload showcase-media "out/showcase-upload/$name" --clobber
          done
          jq --arg repo "$GH_REPO" '[.metadata.assets[] | {name, url: ("https://github.com/" + $repo + "/releases/download/showcase-media/" + .name)}]' /tmp/showcase-validation.json > /tmp/showcase-assets.json
          for entry in showcases/*/showcase.json; do
            [ -f "$entry" ] || continue
            pnpm showcase:media --entry "$entry" --release-assets /tmp/showcase-assets.json
          done
          pnpm showcase:readme
      - name: Commit published showcase metadata
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          BOT="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "$BOT"
          git config user.email "${BOT_ID}+${BOT}@users.noreply.github.com"
          git add --update -- showcases README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: publish showcase media URLs [skip ci]'
          auth="http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # main may move between checkout and push: rebase and retry, never force.
          for attempt in 1 2 3; do
            if git -c "$auth" push origin HEAD:main; then exit 0; fi
            git -c "$auth" fetch origin main
            if ! git rebase origin/main; then git rebase --abort; echo '::error::Showcase metadata conflicts with the new main.'; exit 1; fi
          done
          echo '::error::main kept moving; showcase metadata push abandoned after three attempts.'
          exit 1
