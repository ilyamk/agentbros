name: autoclose

on:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: [pr-intake]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  autoclose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, issues: write, pull-requests: write, actions: read }
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    # A workflow_run pass touches only the triggering PR, so it queues per head repository and branch;
    # the hourly sweep (all open PRs, duplicates and claim expiry) has its own group.
    concurrency:
      group: ${{ github.event_name == 'workflow_run' && format('autoclose-{0}-{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) || 'autoclose-sweep' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      - name: Re-derive facts, apply rules and expire claims
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -n "$RUN_ID" ]; then
            pnpm github:autoclose --run "$RUN_ID"
          else
            pnpm github:autoclose
          fi
