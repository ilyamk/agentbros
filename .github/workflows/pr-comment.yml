name: pr-comment

on:
  workflow_run:
    workflows: [pr-intake, CI, category-gates, context-budget]
    types: [completed]

permissions: {}

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, actions: read, pull-requests: write }
    if: github.event.workflow_run.event == 'pull_request'
    # Keyed on the head repository and branch: forks commonly reuse `main` or `patch-1`. Each run re-derives
    # everything from REST, so the newest pending run for one PR may replace an older pending one.
    concurrency:
      group: intake-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: pr-report
          path: out/untrusted-report
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Re-derive intake from REST, then update comments and labels
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: pnpm github:intake --run "$RUN_ID" --artefact out/untrusted-report
