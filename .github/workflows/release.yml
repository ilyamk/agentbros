name: release

# Runs on the push to main that a merged release PR produces, so the main-only, reviewer-gated
# `release` environment sees refs/heads/main (a pull_request event would present the PR ref).
# A manual dispatch from main retries a release whose approval was rejected, timed out or failed:
# it finds the merged bot/release PR whose merge commit set package.json to that version.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish or retry, for example 0.2.0 (empty uses the version on main)
        required: false
        type: string

permissions: {}

jobs:
  detect:
    # No environment: every push to main runs this, and only a merged release PR continues.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, pull-requests: read }
    outputs:
      pr: ${{ steps.find.outputs.pr }}
      sha: ${{ steps.find.outputs.sha }}
      version: ${{ steps.find.outputs.version }}
    steps:
      - name: Find the merged bot/release PR and skip a version that is already tagged
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSH_SHA: ${{ github.sha }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version_at() { gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GH_REPO/contents/package.json?ref=$1" | jq -er .version; }
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then echo "::error::Dispatch the release workflow from $DEFAULT_BRANCH."; exit 1; fi
            REQUESTED=${REQUESTED#v}
            if [ -z "$REQUESTED" ]; then REQUESTED=$(version_at "$DEFAULT_BRANCH"); fi
            if ! printf '%s\n' "$REQUESTED" | grep -Eqx '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'; then echo "::error::Expected a stable version such as 0.2.0."; exit 1; fi
            SHA=
            for candidate in $(gh api --paginate "repos/$GH_REPO/pulls?state=closed&base=$DEFAULT_BRANCH&head=${GH_REPO%%/*}:bot/release&per_page=100" --jq '.[] | select(.merged_at != null) | .merge_commit_sha'); do
              if [ "$(version_at "$candidate")" = "$REQUESTED" ]; then SHA=$candidate; break; fi
            done
            if [ -z "$SHA" ]; then echo "::error::No merged bot/release PR set package.json to $REQUESTED."; exit 1; fi
            STATUS=$(gh api "repos/$GH_REPO/compare/$SHA...$DEFAULT_BRANCH" --jq .status)
            if [ "$STATUS" != ahead ] && [ "$STATUS" != identical ]; then echo "::error::$SHA is not on $DEFAULT_BRANCH."; exit 1; fi
          else
            SHA=$PUSH_SHA
          fi
          gh api "repos/$GH_REPO/commits/$SHA/pulls" > /tmp/pulls.json
          PR=$(jq -r --arg repo "$GH_REPO" '[.[] | select(.merged_at != null and .head.ref == "bot/release" and .head.repo.full_name == $repo and .base.ref == "main" and any(.labels[]; .name == "release:ready"))] | first | .number // empty' /tmp/pulls.json)
          if [ -z "$PR" ]; then
            if [ "$EVENT" = workflow_dispatch ]; then echo "::error::$SHA is not the merge of a labelled same-repository bot/release PR."; exit 1; fi
            exit 0
          fi
          VERSION=$(version_at "$SHA")
          if gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::notice::Tag v$VERSION already exists; nothing to publish."
            exit 0
          fi
          { echo "pr=$PR"; echo "sha=$SHA"; echo "version=$VERSION"; } >> "$GITHUB_OUTPUT"
  release:
    needs: detect
    if: needs.detect.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GITHUB_TOKEN only reads and attests; the tag and release use the release App token.
    permissions: { contents: read, id-token: write, attestations: write }
    environment: release
    # One release at a time; a queued release waits for the running one instead of cancelling it.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      # Inventory metrics of this job's checkout of main (the merge commit, or a later main on a retry).
      - name: Measure metrics for the release asset
        run: pnpm metrics --write
      - name: Mint the release App token
        id: release-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Build the source archive of the merged base revision
        id: archive
        env:
          MERGE_SHA: ${{ needs.detect.outputs.sha }}
          EXPECTED: ${{ needs.detect.outputs.version }}
        run: |
          git show "$MERGE_SHA:package.json" > /tmp/release-package.json
          VERSION=$(node -p 'require("/tmp/release-package.json").version')
          test "$VERSION" = "$EXPECTED"
          mkdir -p out/release
          git archive --format=tar.gz --prefix="agentbros-$VERSION/" -o "out/release/agentbros-$VERSION.tar.gz" "$MERGE_SHA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=out/release/agentbros-$VERSION.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Attest the archive's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.path }}
      - name: Tag the merged base revision and publish
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          MERGE_SHA: ${{ needs.detect.outputs.sha }}
          VERSION: ${{ steps.archive.outputs.version }}
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::notice::Tag v$VERSION already exists; nothing to publish."
            exit 0
          fi
          git show "$MERGE_SHA:CHANGELOG.md" > /tmp/merged-changelog.md
          awk -v version="$VERSION" '$0 == "## " version { printing=1; next } printing && /^## / { exit } printing { print }' /tmp/merged-changelog.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          gh release create "v$VERSION" --target "$MERGE_SHA" --title "v$VERSION" --notes-file /tmp/release-notes.md "$ARCHIVE" out/metrics/metrics.json
