name: commands

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, issues: write, pull-requests: write }
    # Ordinary discussion never queues here; only slash commands do (gh-commands.ts re-checks the API body).
    if: startsWith(github.event.comment.body, '/')
    concurrency:
      group: commands-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      - name: Parse and tier-check the API-fetched comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm github:commands
