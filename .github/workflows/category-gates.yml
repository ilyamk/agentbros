name: category-gates

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  category-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      # The failing-on-base proof runs the changed tests, which need the same tools as the CI test shards.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm exec remotion browser ensure
      - name: Run the shared category gate plan and failing-on-base proof
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: pnpm github:category-gates --base "$BASE_SHA"
