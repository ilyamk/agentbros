name: pages

on:
  push:
    branches: [main]
  # No `release` trigger: it runs on the tag ref, which the main-only `pages` environment rejects.
  # Merging the release PR pushes to main, which (with the nightly schedule) rebuilds the site;
  # the release job itself only tags and publishes, and never pushes.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, issues: read, pull-requests: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      - run: pnpm metrics --write
      - name: Build the needs board and its data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p out/contrib
          pnpm contrib:scout --limit 1000 --markdown out/contrib/needs.md --out-json out/contrib/needs.json --online
      - run: pnpm site:build --out out/site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out/site
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { pages: write, id-token: write }
    needs: build
    environment: pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
