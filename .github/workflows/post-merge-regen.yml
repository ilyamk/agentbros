name: post-merge-regen

on:
  push:
    branches: [main]

permissions: {}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GITHUB_TOKEN only reads; the push uses the automation App token, which needs a main-ruleset bypass.
    permissions: { contents: read, pull-requests: read }
    if: github.actor != 'agentbros-release[bot]' && github.actor != 'agentbros-automation[bot]'
    environment: automation
    concurrency:
      group: base-regeneration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      - name: Regenerate on the base branch only
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then BASE_SHA="$HEAD_SHA"; fi
          PR=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls" --jq 'map(select(.merged_at != null)) | first.number // empty')
          if [ -n "$PR" ]; then
            pnpm regen:post-merge --base "$BASE_SHA" --head "$HEAD_SHA" --pr "$PR"
          else
            pnpm regen:post-merge --base "$BASE_SHA" --head "$HEAD_SHA"
          fi
          pnpm github:codeowners
      - name: Mint the automation App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID || vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY || secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit generated outputs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          # The noreply address uses the bot account's user ID (not the App ID) so commits attribute to the App.
          BOT="${APP_SLUG}[bot]"
          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "$BOT"
          git config user.email "${BOT_ID}+${BOT}@users.noreply.github.com"
          git add --update
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: regenerate tracked indexes [skip ci]'
          auth="http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # main may move between checkout and push: rebase the generated commit and retry, never force.
          for attempt in 1 2 3; do
            if git -c "$auth" push origin HEAD:main; then exit 0; fi
            git -c "$auth" fetch origin main
            if ! git rebase origin/main; then git rebase --abort; echo '::error::Generated outputs conflict with the new main; the next push regenerates them.'; exit 1; fi
          done
          echo '::error::main kept moving; regeneration push abandoned after three attempts.'
          exit 1
