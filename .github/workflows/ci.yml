name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

# Pull requests run the primary Node only; main and the merge queue also run the fallback (.nvmrc.fallback).
# Half the jobs on a PR keeps runner queues short.
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(github.event_name == 'pull_request' && '["primary"]' || '["primary","fallback"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ${{ matrix.runtime == 'fallback' && '.nvmrc.fallback' || '.nvmrc' }}
      - run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      - name: Prepare the pinned Python environment
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: pnpm runtime:check --expected "$RUNTIME"
        env:
          RUNTIME: ${{ matrix.runtime }}
      - run: pnpm repo:hygiene --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm console:test
      - run: pnpm deps:licences --check --strict --scope repository-source
      - run: pnpm github:codeowners --check
  # The bench contracts run beside the static checks instead of after them.
  # No test:fast here: its files are a subset of tests/*.test.ts, which the tests shards already run.
  workflow-contracts:
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(github.event_name == 'pull_request' && '["primary"]' || '["primary","fallback"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ${{ matrix.runtime == 'fallback' && '.nvmrc.fallback' || '.nvmrc' }}
      - run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      - name: Prepare the pinned Python environment
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: pnpm runtime:check --expected "$RUNTIME"
        env:
          RUNTIME: ${{ matrix.runtime }}
      - name: Install workflow fixture tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm exec remotion browser ensure
      - run: pnpm bench:workflow --action run --suite bench/workflows/v4/suite.json --mode contract --no-spend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: workflow-contracts-${{ matrix.runtime }}
          path: out/bench/workflow-*/
          retention-days: 7
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        runtime: ${{ fromJSON(github.event_name == 'pull_request' && '["primary"]' || '["primary","fallback"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ${{ matrix.runtime == 'fallback' && '.nvmrc.fallback' || '.nvmrc' }}
      - run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      - name: Prepare the pinned Python environment
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: pnpm runtime:check --expected "$RUNTIME"
        env:
          RUNTIME: ${{ matrix.runtime }}
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm exec remotion browser ensure
      - name: Full suite shard
        env:
          SHARD: ${{ matrix.shard }}
        # A test without its own timeout fails by name after ten minutes instead of hanging the job until its limit.
        run: pnpm exec tsx --test --test-timeout=600000 --test-shard="$SHARD/4" --import ./tests/helpers/memory-root.ts tests/*.test.ts
  browser-render:
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(github.event_name == 'pull_request' && '["primary"]' || '["primary","fallback"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ${{ matrix.runtime == 'fallback' && '.nvmrc.fallback' || '.nvmrc' }}
      - run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      - name: Prepare the pinned Python environment
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: pnpm runtime:check --expected "$RUNTIME"
        env:
          RUNTIME: ${{ matrix.runtime }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm exec remotion browser ensure
      - run: pnpm test:browser
      - run: pnpm test:render
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      # python:check verifies the lock offline, so the pinned interpreter (.python-version) must already be installed.
      - run: uv python install
      - run: pnpm python:check
      - run: pnpm python:audit
  python-profiles:
    name: Python profile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: cmake, paths: 'local-engines/prepare' }
          - { profile: yt-dlp, paths: 'reference/add' }
          - { profile: reference, paths: 'reference|footage-shots' }
          - { profile: reference-audio, paths: 'reference' }
          - { profile: transnet, paths: 'footage-shots' }
          - { profile: audio-map, paths: 'audio-map|audio-structure' }
          - { profile: stems, paths: 'audio-stems|reference/audio|audio/stems' }
          - { profile: multicam, paths: 'multicam' }
          - { profile: offset, paths: 'multicam' }
          - { profile: vad, paths: 'speech-local|speech/local' }
          - { profile: diarize, paths: 'speech-local|speech/local' }
          - { profile: sfx-index, paths: 'sfx-index' }
          - { profile: clap, paths: 'sfx-clap' }
          - { profile: matte, paths: 'matte' }
          - { profile: vork, paths: 'vork' }
          - { profile: earshot, paths: 'earshot' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select affected profiles
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          PROFILE_PATHS: ${{ matrix.paths }}
        shell: bash
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            changed_files="$(git diff --name-only "$BASE" HEAD)"
            if grep -E "(^pyproject.toml$|^uv.lock$|^\.python-version$|python-check|python.ts$|workflows/ci.yml|$PROFILE_PATHS)" <<< "$changed_files" > /dev/null; then
              echo 'run=true' >> "$GITHUB_OUTPUT"
            else
              echo 'run=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: steps.changed.outputs.run == 'true'
        with:
          version: "0.13.9"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.changed.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
      - if: steps.changed.outputs.run == 'true'
        run: npm install --global pnpm@12.21.0 --allow-scripts=pnpm
      - if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts --config.ignore-pnpmfile=true
      - if: steps.changed.outputs.run == 'true'
        env:
          PROFILE: ${{ matrix.profile }}
        run: pnpm python:check --mode profiles --profile "$PROFILE"
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    name: ci
    if: always()
    needs: [checks, workflow-contracts, tests, browser-render, python, python-profiles]
    steps:
      - run: test "$NEEDS_RESULT" = success
        env:
          NEEDS_RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
