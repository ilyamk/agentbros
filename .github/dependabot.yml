version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init, analyze and upload-sarif are one release; a split bump leaves CodeQL on mismatched majors.
      codeql-action:
        patterns: ["github/codeql-action*"]
