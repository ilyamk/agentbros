version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for every action bump: each PR costs a full CI run. This also keeps
      # CodeQL's init, analyze and upload-sarif on one release.
      github-actions:
        patterns: ["*"]
