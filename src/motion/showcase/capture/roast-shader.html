<!doctype html>
<html lang="ru" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Hyperframes composition, kept here as the record of public/motion-lab/showcase/roast-shader.mp4. assets/ holds vendored GSAP and shader bundle, plus the film's own stills of ShowcaseRoastGreen and ShowcaseRoastDark. -->
    <script src="assets/gsap.min.js"></script>
    <script src="assets/shader-transitions.global.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #aeb48a; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .scene { position: absolute; inset: 0; }
      .scene img { display: block; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-fps="30" data-width="1920" data-height="1080">
      <div id="scene-1" class="scene clip" data-start="0" data-duration="3" data-track-index="0"><img src="assets/roast-green.png" alt="" /></div>
      <div id="scene-2" class="scene clip" data-start="0" data-duration="3" data-track-index="1"><img src="assets/roast-dark.png" alt="" /></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({ v: 0 }, { v: 1, duration: 3, ease: "none" }, 0);
      window.HyperShader.init({
        bgColor: "#120b06",
        accentColor: "#ff5a1f",
        scenes: ["scene-1", "scene-2"],
        transitions: [{ time: 0.95, shader: "domain-warp", duration: 1.1 }],
        timeline: tl,
      });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
